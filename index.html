  const t = ev.target.closest('[data-action^="cloud-"]'); if(!t) return;
  const a = t.dataset.action;
  if(a === 'cloud-config'){
    const url = $('#cl_url').value.trim().replace(/\/+$/,''), key = $('#cl_key').value.trim();
    if(!/^https:\/\/[^\s/]+$/.test(url)) { $('#cl_url').classList.add('bad'); return toast('La URL debe ser del tipo https://xxxx.supabase.co'); }
    if(key.length < 20) { $('#cl_key').classList.add('bad'); return toast('Pega la clave pública completa'); }
    if(/^sb_secret_/.test(key) || /service_role/.test((()=>{ try{ return atob(key.split('.')[1]||''); }catch(e){ return ''; } })())) return modalAlert('Clave secreta', 'Esa es la clave <b>secreta</b>. Usa la clave <b>publishable</b> (o «anon»), que es la que puede ir en una página web.');
    if(url !== cloud.url){ cloud.session = null; cloud.remoteStamp = null; cloud.pushedLocal = null; }
    cloud.url = url; cloud.key = key; cloud.editing = false; cloudSave(); render(); toast('Conexión guardada. Ahora entra o crea tu cuenta.');
  }
  else if(a === 'cloud-edit'){ cloud.editing = true; render(); }
  else if(a === 'cloud-config-cancel'){ cloud.editing = false; render(); }
  else if(a === 'cloud-login') cloudAuth('login');
  else if(a === 'cloud-signup') cloudAuth('signup');
  else if(a === 'cloud-sync') syncNow(true);
  else if(a === 'cloud-logout'){
    if(!await confirmModal('Cerrar sesión', 'Este dispositivo dejará de sincronizar. Tus datos siguen guardados aquí y en la nube.', 'Cerrar sesión')) return;
    try{ if(cloud.session) await sbFetch('/auth/v1/logout', {method:'POST'}); }catch(e){}
    cloud.session = null; cloud.remoteStamp = null; cloud.pushedLocal = null; cloudSave(); setCloud('', ''); render();
  }
});

/* =========================================================================
   12. RENDER Y EVENTOS
   ========================================================================= */
function render(){
  const v = $('#view');
  if(ui.tab==='train') v.innerHTML = renderTrain();
  else if(ui.tab==='evo') v.innerHTML = renderEvo();
  else if(ui.tab==='body') v.innerHTML = renderBody();
  else v.innerHTML = renderSettings();
  $$('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===ui.tab));
  ensureDatalists();
}
function setView(week, day, opts={}){
  ui.week = Math.min(WEEKS, Math.max(1, week)); ui.day = Math.min(6, Math.max(0, day));
  ui.activeSet = {};
  state.settings.lastView = {week:ui.week, day:ui.day}; save(true);
  ui.tab = 'train'; render();
  if(opts.slot){ const el=$(`[data-slot="${opts.slot}"].ex`); el && el.scrollIntoView({block:'start'}); }
  else if(!opts.keepScroll) window.scrollTo(0,0);
}
function ctx(el){
  const card = el.closest('.ex'); if(!card) return null;
  const item = ITEM_BY_SLOT[card.dataset.slot];
  const row = el.closest('.set');
  return { card, item, slot:item.slot, i: row ? Number(row.dataset.i) : null, row };
}

document.addEventListener('click', async ev => {
  const tabBtn = ev.target.closest('.nav button[data-tab]');
  if(tabBtn){ ui.tab = tabBtn.dataset.tab; bodyEdit=null; render(); window.scrollTo(0,0); return; }
  const t = ev.target.closest('[data-action]'); if(!t) return;
  const a = t.dataset.action;
  const w = ui.week, di = ui.day;
  switch(a){
    case 'modal-ok': return closeModal(true);
    case 'modal-cancel': return closeModal(false);
    case 'modal-choice': return closeModal(t.dataset.v);
    case 'tab': ui.tab=t.dataset.tab; render(); window.scrollTo(0,0); return;
    case 'week': return setView(w + Number(t.dataset.d), di);
    case 'day': return setView(w, Number(t.dataset.i));
    case 'today': {
      const tp = todayPosition();
      if(tp.noStart) toast('Configura la fecha de inicio en Ajustes para saber qué semana toca.');
      else if(tp.before) toast('El programa aún no ha empezado: se muestra la semana 1.');
      else if(tp.after) toast('El programa ya terminó: se muestra la semana 8.');
      return setView(tp.week, tp.day);
    }
    case 'goto': { const det=t.closest('details'); return setView(Number(t.dataset.w), Number(t.dataset.d), {slot:t.dataset.slot}); }
    case 'rest': { const it=ITEM_BY_SLOT[t.dataset.slot]; return startTimer(it.rest, it.label); }
    case 'timer-toggle': return timerToggle();
    case 'timer-reset': return timerReset();
    case 'timer-close': timer=null; timerPersist(); return timerTick();
    case 'timer-add': return timerAdd(Number(t.dataset.sec)||15);
    case 'exportjson': return exportJSON();
    case 'importjson': $('#importFile').value=''; return $('#importFile').click();
    case 'csv': return exportCSV(t.dataset.v);
    case 'wipe': {
      const k=t.dataset.v; const what = k==='all'?'todos los datos (entrenamientos, carreras, medidas y perfil)':k==='train'?'todos los entrenamientos y carreras':'todas las medidas corporales';
      if(!await confirmModal('Borrar datos', `Se borrarán ${what}. Esta acción no se puede deshacer.${cloudOn()?' Si tienes la nube activada, también se borrarán allí al sincronizar.':''}`, 'Borrar', true)) return;
      if(k==='all'){ const keep = {lastBackup: state.settings.lastBackup}; state = freshState(); state.settings.lastBackup = keep.lastBackup; }
      else if(k==='train') state.sessions = {}; else state.body = [];
      save(); render(); toast('Datos borrados'); return;
    }
    case 'pt': return showPointInfo(t.dataset.c, Number(t.dataset.i));
    case 'evometric': state.settings.evo.metric=t.dataset.v; ui.chartSel=null; save(true); return render();
    case 'runfilter': state.settings.evo.runFilter=t.dataset.v; ui.chartSel=null; save(true); return render();
    case 'runmetric': state.settings.evo.runMetric=t.dataset.v; ui.chartSel=null; save(true); return render();
    case 'bodyedit': bodyEdit=t.dataset.id; render(); window.scrollTo(0,0); return;
    case 'bodycancel': bodyEdit=null; return render();
    case 'bodydel': {
      const b = state.body.find(x=>x.id===t.dataset.id); if(!b) return;
      if(!await confirmModal('Borrar registro', `¿Borrar el registro del ${fmtDateLong(b.date)}?`, 'Borrar', true)) return;
      state.body = state.body.filter(x=>x.id!==b.id); if(bodyEdit===b.id) bodyEdit=null; save(); return render();
    }
    case 'runkind': case 'rpe': {
      const s = ensureSession(w, di); s.run = s.run || {};
      if(a==='rpe'){ const v=Number(t.dataset.v); s.run.rpe = s.run.rpe===v ? null : v; } else s.run.kind = t.dataset.v;
      save(); const y=window.scrollY; $('#runCard').outerHTML = runCardHTML(w, di); window.scrollTo(0,y); refreshProgress(); return;
    }
    case 'runclear': {
      if(!await confirmModal('Borrar carrera', 'Se borrará el registro de carrera de este día.', 'Borrar', true)) return;
      const s = getSession(w, di); if(s){ s.run=null; save(); } $('#runCard').outerHTML = runCardHTML(w, di); refreshProgress(); return;
    }
  }
  // Acciones de ejercicio
  const c = ctx(t); if(!c) return;
  const item = c.item;
  if(a==='toggle'){
    const log = materialize(w, di, item); const v = getVariant(log.variantId); const st = log.sets[c.i];
    if(!st.done && !canComplete(st, v.type, log.split)){
      const need = [];
      if(setLoad(st, v.type)==null) need.push(v.type==='band'?'el tipo de goma':v.type==='assist'?'los kg de asistencia':'el peso');
      if(setVal(st, log.split)==null) need.push(log.split ? 'los dos lados' : v.type==='iso'?'los segundos':'las repeticiones');
      return toast('Para completar la serie indica ' + need.join(' y ') + '.');
    }
    st.done = !st.done; st.pre = false; save();
    c.row.classList.toggle('done', st.done); c.row.classList.remove('pre');
    $('.chk', c.row).setAttribute('aria-pressed', st.done);
    if(!log.sets.some(x=>x.pre && !x.done)) { const pl = $('.prelbl', c.card); pl && pl.remove(); }
    refreshDerived(item.slot);
    if(st.done && state.settings.autoTimer) startTimer(item.rest, item.label);
    return;
  }
  if(a==='copyprev'){
    const log = materialize(w, di, item); const v = getVariant(log.variantId);
    const prev = log.sets[c.i-1], st = log.sets[c.i]; if(!prev) return;
    if(v.type==='band'){ if(!prev.band) return toast('La serie anterior no tiene goma'); st.band = prev.band; $('input[data-f="band"]', c.row).value = prev.band; }
    else { if(!isNum(prev.load)) return toast('La serie anterior no tiene peso'); st.load = prev.load; const inp=$('input[data-f="load"]', c.row); inp.value = fmt(prev.load); inp.classList.remove('bad'); }
    st.pre = false; c.row.classList.remove('pre'); ui.activeSet[item.slot]=c.i; save(); refreshDerived(item.slot);
    const next = $(`input[data-f="${log.split?'valL':'val'}"]`, c.row); next && next.focus();
    return;
  }
  if(a==='addset'){
    const log = materialize(w, di, item); const last = log.sets[log.sets.length-1];
    const ns = emptySet(); log.sets.push(ns); save(); rerenderCard(item.slot);
    const rows = $$(`[data-slot="${item.slot}"].ex .set`); const r = rows[rows.length-1]; r && $('input', r).focus();
    return;
  }
  if(a==='delset'){
    const log = materialize(w, di, item); if(!log.sets.length) return;
    const st = log.sets[log.sets.length-1];
    if(hasAnyValue(st) && !await confirmModal('Quitar serie', `La serie ${log.sets.length} tiene datos${st.done?' y está marcada como hecha':''}. ¿Quitarla?`, 'Quitar', true)) return;
    log.sets.pop(); save(); rerenderCard(item.slot); refreshAllRecords(); return;
  }
  if(a==='setmenu'){
    const log = viewLog(w, di, item);
    openModal(`<h3>Serie ${c.i+1} · ${esc(item.label)}</h3><p>Planificación original sin cambios: solo se modifica lo realizado.</p><div class="acts">
      <button class="btn" data-action="set-clear" data-slot="${item.slot}" data-i="${c.i}">Vaciar valores de la serie</button>
      <button class="btn danger" data-action="set-del" data-slot="${item.slot}" data-i="${c.i}" ${log.sets.length<1?'disabled':''}>Eliminar esta serie</button>
      <button class="btn ghost" data-action="modal-cancel">Cancelar</button></div>`);
    return;
  }
  if(a==='prefill'){
    const log = materialize(w, di, item); const v = getVariant(log.variantId);
    const p = prevEntry(keyOf(v, log.conv), w*10+di);
    if(!p) return toast('No hay una sesión anterior de esta variante');
    let filled = 0;
    p.log.sets.filter(st=>isCompleted(st, v.type, p.log.split)).forEach((src, k)=>{
      if(!log.sets[k]) return;
      const dst = log.sets[k]; if(dst.done || hasAnyValue(dst)) return;
      Object.assign(dst, {load:src.load, band:src.band||'', val:src.val, valL:src.valL, valR:src.valR, rir:null, done:false, pre:true}); filled++;
    });
    if(p.log.split && !log.split && filled) log.split = true;
    if(!filled) return toast('No hay series vacías para rellenar');
    save(); rerenderCard(item.slot);
    toast(`${filled} serie(s) recuperadas: pendientes de confirmar`);
    return;
  }
  if(a==='conv'){
    const log = materialize(w, di, item); const v = getVariant(log.variantId);
    const nv = t.dataset.v; if(log.conv===nv) return;
    if(log.sets.some(hasAnyValue) && !await confirmModal('Cambiar convención', `Los pesos de esta sesión pasarán a interpretarse como <b>${nv==='total'?'peso total':'peso por mancuerna'}</b>. El historial de cada convención se mantiene separado. Revisa los kg introducidos.`, 'Cambiar')) return;
    log.conv = nv; state.settings.dbConv[v.vid] = nv; save(); rerenderCard(item.slot); return;
  }
});
// Acciones dentro del modal de serie
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-action="set-clear"],[data-action="set-del"]'); if(!t) return;
  const item = ITEM_BY_SLOT[t.dataset.slot]; const i = Number(t.dataset.i);
  const log = materialize(ui.week, ui.day, item);
  if(t.dataset.action==='set-clear'){ log.sets[i] = emptySet(); }
  else { log.sets.splice(i,1); }
  closeModal(false); save(); rerenderCard(item.slot); refreshAllRecords();
});
$('#modal').addEventListener('click', ev=>{ if(ev.target.id==='modal') closeModal(false); });
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape' && !$('#modal').hidden) closeModal(false); });
$('#importFile').addEventListener('change', ev=>{ const f=ev.target.files[0]; if(f) importJSON(f); });

document.addEventListener('input', ev => {
  const t = ev.target; const f = t.dataset.f; if(!f) return;
  const w = ui.week, di = ui.day;
  if(t.closest('.set')){
    const c = ctx(t); const item = c.item;
    const log = materialize(w, di, item); const v = getVariant(log.variantId); const st = log.sets[c.i];
    if(f==='band'){ st.band = t.value; }
    else {
      const r = parseNum(t.value, {int: f!=='load'});
      t.classList.toggle('bad', !r.ok);
      st[f] = r.ok ? r.v : null;
    }
    if(st.pre){ st.pre=false; c.row.classList.remove('pre'); }
    if(st.done && !canComplete(st, v.type, log.split)){ st.done=false; c.row.classList.remove('done'); $('.chk',c.row).setAttribute('aria-pressed','false'); toast('Serie desmarcada: faltan datos.'); }
    ui.activeSet[item.slot] = c.i;
    save(); refreshDerived(item.slot); return;
  }
  if(f==='exnotes'){ const c=ctx(t); const log=materialize(w,di,c.item); log.notes=t.value; save(); return; }
  if(f==='daynotes'){ const s=ensureSession(w,di); s.notes=t.value; save(); return; }
  if(f==='run.dur' || f==='run.dist' || f==='run.notes'){
    const s=ensureSession(w,di); s.run = s.run || {};
    if(f==='run.notes') s.run.notes = t.value;
    else if(f==='run.dur'){ const r=parseDuration(t.value); t.classList.toggle('bad', !r.ok); s.run.dur = r.ok?r.v:null; s.run.durRaw = r.ok&&r.v!=null ? t.value.trim() : null; }
    else { const r=parseNum(t.value); t.classList.toggle('bad', !r.ok); s.run.dist = r.ok?r.v:null; }
    save();
    const r = s.run; const pace = (isNum(r.dur)&&isNum(r.dist)&&r.dist>0&&r.dur>0) ? r.dur/r.dist : null;
    $('#runPace').innerHTML = pace?`Ritmo medio: <b class="num">${fmtPace(pace)} min/km</b>`:`<span class="faint">El ritmo medio aparece al indicar duración y distancia.</span>`;
    const pill = $('#runCard .pill'); if(pill){ pill.textContent = isNum(r.dur)?'Registrada':'Sin registrar'; pill.classList.toggle('grey', !isNum(r.dur)); }
    refreshProgress(); return;
  }
  if(f==='height'){ const r=parseNum(t.value); t.classList.toggle('bad', !r.ok); if(r.ok){ state.profile.heightCm=r.v; save(); } return; }
});
document.addEventListener('change', async ev => {
  const t = ev.target; const f = t.dataset.f;
  if(t.id==='weekSel') return setView(Number(t.value), ui.day);
  if(!f) return;
  const w = ui.week, di = ui.day;
  if(f==='variant'){
    const c = ctx(t); const item=c.item; const log = materialize(w, di, item);
    const oldV = getVariant(log.variantId), nv = getVariant(t.value);
    if(oldV.type!==nv.type && log.sets.some(hasAnyValue)){
      if(!await confirmModal('Cambiar variante', `«${esc(nv.name)}» se registra con otros campos. Se vaciarán los valores de esta sesión para no mezclar datos no comparables.`, 'Cambiar y vaciar', true)){ t.value = log.variantId; return; }
      log.sets = log.sets.map(()=>emptySet());
    }
    log.variantId = nv.vid; log.conv = nv.type==='db' ? convOf(nv) : null;
    if(!(nv.unilateral || item.perSide)) log.split=false;
    save(); rerenderCard(item.slot); return;
  }
  if(f==='split'){
    const c=ctx(t); const log=materialize(w,di,c.item);
    log.split = t.checked;
    log.sets.forEach(st=>{ if(log.split && isNum(st.val) && st.valL==null && st.valR==null){ st.valL=st.val; st.valR=st.val; } if(!log.split && st.val==null && isNum(st.valL) && isNum(st.valR)) st.val=Math.min(st.valL,st.valR); });
    save(); rerenderCard(c.item.slot); return;
  }
  if(f==='sessdate'){
    if(!t.value){ toast('La fecha realizada no puede quedar vacía'); const s=getSession(w,di); t.value = s&&s.date||''; return; }
    const s=ensureSession(w,di); s.date=t.value; save(); const y=scrollY; render(); scrollTo(0,y); return;
  }
  if(f==='start'){ state.profile.startDate = t.value || null; save(); return render(); }
  if(f==='autotimer'){ state.settings.autoTimer = t.checked; save(); return; }
  if(f==='evo.key'){ state.settings.evo.key=t.value; state.settings.evo.at=null; ui.chartSel=null; save(true); return render(); }
  if(f==='evo.at'){ state.settings.evo.at=t.value; ui.chartSel=null; save(true); return render(); }
  if(f==='bodymetric'){ state.settings.bodyMetric=t.value; ui.chartSel=null; save(true); return render(); }
});
document.addEventListener('submit', ev => {
  if(ev.target.id!=='bodyForm') return; ev.preventDefault();
  const date = $('#b_date').value; if(!date){ $('#b_date').classList.add('bad'); return toast('Indica la fecha del registro'); }
  const rec = { date, method:$('#b_method').value.trim(), notes:$('#b_notes').value.trim() };
  let bad=false;
  for(const [k] of MEASURES){ const inp=$('#b_'+k); const r=parseNum(inp.value); inp.classList.toggle('bad', !r.ok); if(!r.ok) bad=true; rec[k]=r.v; }
  if(bad) return toast('Revisa los campos marcados');
  if(isNum(rec.fatPct) && rec.fatPct>100){ $('#b_fatPct').classList.add('bad'); return toast('El porcentaje de grasa no puede superar 100'); }
  if(!MEASURES.some(([k])=>isNum(rec[k])) && !rec.notes && !rec.method) return toast('Añade al menos una medida u observación');
  if(bodyEdit){ const b=state.body.find(x=>x.id===bodyEdit); Object.assign(b, rec, {updatedAt:new Date().toISOString()}); bodyEdit=null; }
  else state.body.push(Object.assign({id:uid('b'), createdAt:new Date().toISOString()}, rec));
  if(save()) toast('Registro guardado'); render();
});

/* Foco: recordar la serie activa ("Con X kg…") y evitar que el teclado tape el campo */
document.addEventListener('focusin', ev => {
  const t = ev.target;
  if(t.closest && t.closest('.set')){ const c=ctx(t); if(ui.activeSet[c.slot]!==c.i){ ui.activeSet[c.slot]=c.i; refreshDerived(c.slot); } }
  if(t.matches && t.matches('input,textarea,select')){
    setTimeout(()=>{ try{ const r=t.getBoundingClientRect(); const vh=(window.visualViewport?visualViewport.height:innerHeight); if(r.bottom > vh-20 || r.top < 110) t.scrollIntoView({block:'center', behavior:'smooth'}); }catch(e){} }, 320);
  }
});
if(window.visualViewport){
  const kb = () => document.body.classList.toggle('kb', visualViewport.height < window.innerHeight*0.78 && /input|textarea/i.test(document.activeElement?.tagName||''));
  visualViewport.addEventListener('resize', kb); document.addEventListener('focusout', ()=>setTimeout(kb, 80));
}
/* Pulsar «siguiente» en el teclado: saltar al siguiente campo de la serie */
document.addEventListener('keydown', ev => {
  if(ev.key!=='Enter') return; const t=ev.target; if(!t.closest || !t.closest('.set') || t.tagName!=='INPUT') return;
  ev.preventDefault(); const ins=$$('.set input', t.closest('.ex')); const k=ins.indexOf(t); if(ins[k+1]) ins[k+1].focus(); else t.blur();
});
window.addEventListener('storage', ev => { if(ev.key===STORE_KEY){ try{ state = migrate(JSON.parse(ev.newValue)); dirtyEntries=true; render(); }catch(e){} } });

/* Inicio */
renderBanners();
render();
timerRestore();
if(storageOK && state.updatedAt) setSaveState('ok', 'Datos cargados');
if(cloudOn()){ setCloud('wait','Nube…'); syncNow(false); }
</script>
