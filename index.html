<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0d10">
<meta name="color-scheme" content="dark">
<title>Entreno 8 semanas</title>
<style>
:root{
  --bg:#0b0d10; --surface:#14181e; --surface2:#141d2b; --surface3:#1b2636;
  --line:#253042; --line2:#33425a;
  --text:#f2f5f8; --muted:#a9b3c1; --faint:#7d8898;
  --accent:#5b9cff; --accent-strong:#3f86ff; --accent-ink:#06101f; --accent-soft:rgba(91,156,255,.14);
  --warn:#e3b064; --danger:#ef7a71; --ok:#5b9cff;
  --r:14px; --r-sm:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:62px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 16px);overflow-wrap:anywhere}
body.has-timer{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 84px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 10px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:19px} h3{font-size:16px}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(11,13,16,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #161c25}
.top .wrap{display:flex;align-items:center;justify-content:space-between;min-height:48px;gap:8px;padding-top:env(safe-area-inset-top,0px)}
.brand{font-weight:700;letter-spacing:.02em;font-size:15px}
.brand span{color:var(--accent)} .brand .bw{font-weight:700}
@media (max-width:390px){ .brand .bw{display:none} }
.cloud{border:1px solid var(--line2);background:transparent;border-radius:999px;font-size:12px;font-weight:650;color:var(--muted);padding:0 9px;min-height:30px;white-space:nowrap}
.cloud.ok{color:#cfe0ff;border-color:#2e4566} .cloud.err{color:var(--danger);border-color:#5a3430} .cloud.wait{color:var(--warn)}
.cloud{position:relative} .cloud::after{content:"";position:absolute;inset:-8px -2px}
.save{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.save.ok .dot{background:var(--accent)}
.save.err{color:var(--danger)} .save.err .dot{background:var(--danger)}
.banner{margin:10px 0 0;padding:12px 14px;border-radius:var(--r-sm);background:#2a1d1b;border:1px solid #5a3430;color:#ffd9d4;font-size:14px}
.banner b{color:#fff}
.hint{margin:10px 0 0;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--line);font-size:13.5px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:space-between}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;margin-top:12px}
.card.night{background:var(--surface2)}
.btn{min-height:44px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface3);color:var(--text);font-weight:560;display:inline-flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{border-color:#5a3430;color:var(--danger);background:transparent}
.btn.sm{min-height:44px;padding:0 10px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
label.lbl{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px;font-weight:550}
.field{min-height:44px;width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line2);background:#0f141b;color:var(--text)}
textarea.field{min-height:64px;resize:vertical;line-height:1.4}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field.bad,input.bad{border-color:var(--danger)!important}
details>summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:580}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:6px;transition:transform .15s;flex:none}
details[open]>summary::after{transform:rotate(-135deg)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:#cfe0ff;font-size:12.5px;font-weight:600}
.pill.grey{background:#1e2733;color:var(--muted)}
.pill.warn{background:rgba(227,176,100,.13);color:#f1d3a3}
ul.clean{margin:6px 0 0;padding-left:18px} ul.clean li{margin:3px 0}

/* week / day nav */
.wknav{display:grid;grid-template-columns:44px 1fr 44px auto;gap:6px;margin-top:12px;align-items:center}
.iconbtn{width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface3);display:grid;place-items:center;color:var(--text);padding:0}
.iconbtn svg{width:20px;height:20px}
.wksel{min-height:44px;font-weight:650;text-align:center;text-align-last:center}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:8px}
.day{min-height:52px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;font-weight:650;font-size:14px;color:var(--muted)}
.day .d{width:18px;height:4px;border-radius:2px;background:#273142}
.day.partial .d{background:linear-gradient(90deg,var(--accent) 50%,#273142 50%)}
.day.full .d{background:var(--accent)}
.day.opt .d{background:transparent;border:1px dashed #3a475b;height:4px}
.day.opt.full .d{background:var(--accent);border:none}
.day.sel{background:var(--surface3);border-color:var(--accent);color:var(--text)}
.day.today{box-shadow:inset 0 -2px 0 var(--accent)}

/* session header */
.sess-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sess-title{font-size:21px}
.sess-sub{margin-top:2px;color:var(--muted);font-size:14px}
.phase{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prog{margin-top:12px}
.bar{height:8px;border-radius:999px;background:#212b39;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .2s}
.prog-l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.datebox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.datebox .planned{font-size:13px;color:var(--muted);padding-top:4px}
.collap{border-top:1px solid var(--line);margin-top:12px;padding-top:2px}
.collap+.collap{margin-top:0}
.collap .body{padding:0 2px 10px;color:var(--muted);font-size:14px}

/* exercise card */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px;padding:12px;scroll-margin-top:60px}
.ex-h{display:flex;gap:10px;align-items:flex-start}
.ex-n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--surface3);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.ex-name{font-size:16.5px;font-weight:650;line-height:1.3}
.ex-tgt{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.ex-tgt b{font-weight:650}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.restbtn{min-height:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:#cfe0ff;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.restbtn::before{content:"";width:0;height:0;border-left:7px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.restbtn{position:relative}
.restbtn::after{content:"";position:absolute;inset:-4px 0}
.vsel{margin-top:8px}
.note{margin-top:8px;font-size:13.5px;color:var(--muted);padding-left:10px;border-left:2px solid var(--line2)}
.deload{margin-top:6px;font-size:13px;color:#f1d3a3}

.rec{position:sticky;top:49px;z-index:5;margin:10px -4px 0;padding:9px 10px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid #23324a;font-size:13.5px;box-shadow:0 6px 12px -8px rgba(0,0,0,.8)}
.rec .r1{font-weight:650;color:var(--text);font-size:14.5px}
.rec .r1 .k{color:var(--accent)}
.rec .r2{color:#c3ccd8;margin-top:2px}
.rec .r3{color:var(--muted);margin-top:2px}
.rec .today{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:5px;padding:1px 5px;margin-left:4px;vertical-align:1px}

.sets{margin-top:10px}
.sgrid{display:grid;grid-template-columns:30px minmax(0,1fr) 34px minmax(0,1fr) 46px 46px;gap:5px;align-items:center}
.sgrid.split{grid-template-columns:30px minmax(0,1.15fr) 34px minmax(0,1fr) minmax(0,1fr) 42px 46px}
.shead{font-size:11.5px;color:var(--faint);font-weight:650;text-transform:uppercase;letter-spacing:.03em;padding:0 0 4px}
.shead>div{text-align:center} .shead>div:first-child{text-align:left}
.set{margin-top:5px;padding:3px;border-radius:12px;border:1px solid transparent}
.set.done{background:rgba(91,156,255,.07);border-color:rgba(91,156,255,.28)}
.set.pre input{font-style:italic;color:#9fb3cf;border-style:dashed}
.sn{height:44px;border:none;background:transparent;color:var(--muted);font-weight:700;padding:0;font-size:14px;border-radius:8px}
.sn:active{background:var(--surface3)}
.set input{width:100%;min-width:0;height:44px;border-radius:9px;border:1px solid var(--line2);background:#0f141b;text-align:center;font-size:17px;font-weight:600;padding:0 4px;font-variant-numeric:tabular-nums}
.set input.rir{font-size:15px;font-weight:500;color:#c3ccd8}
.set input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.set input::placeholder{color:#4d5868;font-weight:400;font-style:normal}
.cp{height:44px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:0;font-size:12px;font-weight:700;line-height:1}
.cp[disabled]{opacity:.25}
.chk{height:44px;border-radius:10px;border:1.5px solid var(--line2);background:transparent;display:grid;place-items:center;padding:0}
.chk svg{width:20px;height:20px;stroke:#465266}
.set.done .chk{background:var(--accent);border-color:var(--accent)}
.set.done .chk svg{stroke:var(--accent-ink)}
.prelbl{margin-top:6px;font-size:12.5px;color:#9fb3cf}
.realized{margin-top:8px;font-size:13px;color:var(--muted)}
.realized b{color:var(--text);font-weight:600}
.setbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.setbtns .wide{grid-column:1/-1}
.ex-notes{margin-top:10px}
.ex-notes textarea{min-height:48px}
.ex-more{margin-top:6px;border-top:1px solid var(--line)}
.ex-more .body{font-size:13.5px;color:var(--muted);padding-bottom:8px}
.hist-item{padding:8px 0;border-top:1px dashed #253042;display:flex;justify-content:space-between;gap:8px;align-items:center}
.hist-item:first-child{border-top:none}
.hist-item .t{color:var(--text);font-weight:600;font-size:13.5px}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:600;padding:0 4px;min-height:44px;min-width:44px;font-size:13.5px}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r-sm);overflow:hidden;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 12px;border:none;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}

.ss{margin-top:12px;border:1px solid #2a3a55;border-radius:calc(var(--r) + 4px);padding:4px 6px 6px;background:linear-gradient(180deg,rgba(91,156,255,.06),transparent 60%)}
.ss>.ss-h{padding:8px 6px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ss>.ex{margin-top:6px}

/* run */
.run-plan{margin-top:8px;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid #23324a;font-size:15px;font-weight:560}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.rpe button{min-height:44px;border-radius:9px;border:1px solid var(--line2);background:#0f141b;font-weight:650}
.rpe button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pace{margin-top:8px;font-size:14px}
.pace b{font-size:16px}

/* charts */
.chart{margin-top:10px;width:100%;max-width:680px}
.chart svg{display:block;width:100%;height:auto;touch-action:manipulation}
.chart .axis text{fill:#9aa5b4;font-size:10.5px}
.chart .grid line{stroke:#1f2834}
.chart .pt{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.chart .pt.sel{fill:#fff;stroke:var(--accent);stroke-width:3}
.chart .hit{fill:transparent;cursor:pointer}
.cinfo{margin-top:8px;min-height:44px;padding:9px 12px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid #23324a;font-size:13.5px;color:var(--muted)}
.cinfo b{color:var(--text)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table.list{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
table.list th,table.list td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
table.list th{color:var(--faint);font-weight:650;font-size:12px;text-transform:uppercase;letter-spacing:.03em;border-top:none}

/* body */
.bmi{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.bmi .v{font-size:26px;font-weight:700}
.entry{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.entry:first-child{border-top:none}
.entry .vals{font-size:13.5px;color:var(--muted)}
.entry .vals b{color:var(--text);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(14,17,22,.97);border-top:1px solid #1c2430;padding-bottom:var(--safe-b);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{border:none;background:transparent;color:var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:650;letter-spacing:.01em}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent)}
body.kb .nav{display:none}
body.kb .timer{bottom:8px}

/* timer */
.timer{position:fixed;left:8px;right:8px;bottom:calc(var(--nav-h) + var(--safe-b) + 8px);z-index:41;max-width:560px;margin:0 auto;background:#172234;border:1px solid #2e4566;border-radius:16px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px -10px rgba(0,0,0,.9)}
.timer[hidden]{display:none}
.timer .tl{flex:1 1 auto;min-width:0}
.timer .tt{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.timer .tn{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer.end{border-color:var(--accent);background:#16294a}
.timer .iconbtn{background:#1f2d43;border-color:#2e4566}
.timer .plus{width:auto;padding:0 10px;font-size:13px;font-weight:700;white-space:nowrap}
.shead>div{white-space:nowrap;overflow:hidden;text-overflow:clip}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:10px}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line2);border-radius:18px;padding:18px 16px calc(14px + var(--safe-b));max-height:86vh;overflow:auto}
.sheet h3{margin-bottom:8px}
.sheet p{margin:6px 0;color:var(--muted);font-size:14.5px}
.sheet .acts{display:grid;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 90px);z-index:70;background:#e9eef5;color:#0b0d10;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:560;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}

@media (min-width:900px){
  .ex.has-cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:0 18px}
  .ex.has-cols>.col-main{grid-column:1}
  .ex.has-cols>.col-side{grid-column:2;grid-row:1 / span 3}
  .ex.has-cols .ex-notes{margin-top:0}
  .ex.has-cols .ex-notes textarea{min-height:160px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .rec{position:static}
}
@media (max-width:370px){
  .sgrid{grid-template-columns:26px minmax(0,1fr) 30px minmax(0,1fr) 42px 44px;gap:4px}
  .sgrid.split{grid-template-columns:26px minmax(0,1.1fr) 30px minmax(0,1fr) minmax(0,1fr) 38px 44px;gap:3px}
  .set input{font-size:16px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">ENTRENO <span>8</span><b class="bw"> SEMANAS</b></div>
  <div class="row" style="gap:10px;flex-wrap:nowrap"><div id="saveState" class="save" role="status" aria-live="polite"><span class="dot"></span><span class="t">Sin cambios</span></div>
  <button id="cloudState" class="cloud" data-action="tab" data-tab="settings" hidden aria-label="Estado de la nube"></button></div>
</div></header>

<div class="wrap" id="banners"></div>
<main class="wrap" id="view"></main>

<div class="timer" id="timer" hidden role="timer" aria-live="off">
  <div class="tl"><div class="tt" id="tTime">0:00</div><div class="tn" id="tName">Descanso</div></div>
  <button class="iconbtn plus" data-action="timer-add" data-sec="15" aria-label="Añadir 15 segundos">+15</button>
  <button class="iconbtn" data-action="timer-toggle" id="tToggle" aria-label="Pausar"></button>
  <button class="iconbtn" data-action="timer-reset" aria-label="Reiniciar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
  <button class="iconbtn" data-action="timer-close" aria-label="Cerrar temporizador"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum = v => typeof v==='number' && isFinite(v);
const round2 = n => Math.round(n*100)/100;
const fmt = n => isNum(n) ? String(round2(n)).replace('.', ',') : '';
function parseNum(str, {int=false}={}){
  const s = String(str==null?'':str).trim().replace(',', '.');
  if(s==='') return {ok:true, v:null};
  if(!/^\d*\.?\d*$/.test(s) || s==='.') return {ok:false, v:null};
  const n = Number(s);
  if(!isFinite(n) || n<0) return {ok:false, v:null};
  if(int && !Number.isInteger(n)) return {ok:false, v:null};
  return {ok:true, v:round2(n)};
}
function parseDuration(str){ // "32", "32,5", "32:30", "1:05:00" → minutos
  const s = String(str||'').trim().replace(',', '.');
  if(!s) return {ok:true, v:null};
  if(/^\d+(\.\d+)?$/.test(s)) return {ok:true, v:Number(s)};
  const p = s.split(':');
  if(p.length>=2 && p.length<=3 && p.every(x=>/^\d+$/.test(x))){
    const n = p.map(Number);
    const min = p.length===2 ? n[0] + n[1]/60 : n[0]*60 + n[1] + n[2]/60;
    if((p.length===2 && n[1]<60) || (p.length===3 && n[1]<60 && n[2]<60)) return {ok:true, v:round2(min)};
  }
  return {ok:false, v:null};
}
const fmtDur = min => { if(!isNum(min)) return ''; const t=Math.round(min*60); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  return h? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`; };
const fmtPace = minPerKm => { if(!isNum(minPerKm)) return ''; const t=Math.round(minPerKm*60); return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`; };

/* Fechas en formato local YYYY-MM-DD */
const pad2 = n => String(n).padStart(2,'0');
const toISO = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const fromISO = s => { if(!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const todayISO = () => toISO(new Date());
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => { const x=new Date(d); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; };
const DOW = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MON = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtDate = s => { const d=fromISO(s); return d ? `${DOW[d.getDay()].slice(0,3)} ${d.getDate()} ${MON[d.getMonth()]}` : ''; };
const fmtDateLong = s => { const d=fromISO(s); return d ? `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}` : ''; };
const fmtDateShort = s => { const d=fromISO(s); return d ? `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}` : ''; };

function plannedDate(week, dayIdx){
  const st = fromISO(state.profile.startDate); if(!st) return null;
  return toISO(addDays(mondayOf(st), (week-1)*7 + dayIdx));
}

const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function freshState(){
  return { app:APP_ID, version:DATA_VERSION, createdAt:new Date().toISOString(), updatedAt:null,
    profile:{ startDate:null, heightCm:null },
    settings:{ dbConv:{}, lastView:{week:1, day:0}, lastBackup:null, autoTimer:true, evo:{} },
    sessions:{}, body:[] };
}
function migrate(d){
  // Punto único de migración entre versiones de datos.
  if(!d || typeof d!=='object') throw new Error('Datos no válidos');
  let v = Number(d.version)||0;
  if(v > DATA_VERSION) throw new Error('Los datos son de una versión más reciente de la aplicación.');
  if(v < 1){ v = 1; } // v0 → v1: sin cambios estructurales conocidos
  const base = freshState();
  const out = Object.assign(base, d, {app:APP_ID, version:DATA_VERSION});
  out.profile = Object.assign(base.profile, d.profile||{});
  out.settings = Object.assign(freshState().settings, d.settings||{});
  out.sessions = d.sessions && typeof d.sessions==='object' ? d.sessions : {};
  out.body = Array.isArray(d.body) ? d.body : [];
  return out;
}

let storageOK = true, storageMsg = '';
function testStorage(){
  try{ const k='entreno8:test'; localStorage.setItem(k,'1'); const ok = localStorage.getItem(k)==='1'; localStorage.removeItem(k); return ok; }
  catch(e){ return false; }
}
function loadState(){
  storageOK = testStorage();
  if(!storageOK){ storageMsg='blocked'; return freshState(); }
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(e){ storageOK=false; storageMsg='blocked'; return freshState(); }
  if(!raw) return freshState();
  try{ return migrate(JSON.parse(raw)); }
  catch(e){
    try{ localStorage.setItem(STORE_KEY+':corrupt-'+Date.now(), raw); }catch(_){}
    storageMsg='corrupt';
    return freshState();
  }
}
let state = loadState();
let dirtyEntries = true;

function save(silent){
  dirtyEntries = true;
  if(!silent) state.updatedAt = new Date().toISOString();
  if(!storageOK){ setSaveState('err', 'Sin guardar'); return false; }
  try{
    const json = JSON.stringify(state);
    localStorage.setItem(STORE_KEY, json);
    if(!silent){
      const back = localStorage.getItem(STORE_KEY);
      if(back !== json) throw new Error('verify');
      const t = new Date();
      setSaveState('ok', `Guardado ${pad2(t.getHours())}:${pad2(t.getMinutes())}`);
      scheduleSync();
    }
    return true;
  }catch(e){
    setSaveState('err', e && e.name==='QuotaExceededError' ? 'Sin espacio: no guardado' : 'Error: no guardado');
    if(!silent) toast('No se ha podido guardar. Exporta una copia desde Ajustes.');
    return false;
  }
}
function setSaveState(cls, text){
  const el = $('#saveState'); el.className = 'save ' + cls; $('.t', el).textContent = text;
}

/* =========================================================================
   4. MODELO DE SESIONES Y REGISTROS
   ========================================================================= */
const ui = { tab:'train', week:1, day:0, activeSet:{}, chartSel:null };
{
  const lv = state.settings.lastView||{};
  ui.week = Math.min(WEEKS, Math.max(1, Number(lv.week)||1));
  ui.day = Math.min(6, Math.max(0, Number(lv.day)||0));
}

function getSession(week, dayIdx){ return state.sessions[sessionId(week, PLAN[dayIdx].id)] || null; }
function ensureSession(week, dayIdx){
  const id = sessionId(week, PLAN[dayIdx].id);
  if(!state.sessions[id]){
    state.sessions[id] = { id, week, day:PLAN[dayIdx].id, date: plannedDate(week, dayIdx) || todayISO(), notes:'', ex:{}, run:null, createdAt:new Date().toISOString() };
  }
  return state.sessions[id];
}
const variantId = (exId, vId) => `${exId}.${vId}`;
function getVariant(vid){
  const [e,v] = String(vid).split('.'); const ex = EXERCISES[e]; if(!ex) return null;
  const vv = ex.variants.find(x=>x.id===v); return vv ? Object.assign({exId:e, exName:ex.name, vid}, vv) : null;
}
const keyOf = (v, conv) => v.type==='db' ? `${v.vid}@${conv||'per'}` : v.vid;
const convOf = (v) => state.settings.dbConv[v.vid] || 'per';
const emptySet = () => ({ load:null, val:null, valL:null, valR:null, band:'', rir:null, done:false, pre:false });

function defaultVariantId(item){
  // Última variante usada para este ejercicio en el programa; si no hay, la primera.
  let best=null, bestPos=-1;
  for(const s of Object.values(state.sessions)){
    const d = DAY_BY_ID[s.day]; if(!d) continue;
    for(const [slot,log] of Object.entries(s.ex||{})){
      const it = ITEM_BY_SLOT[slot]; if(!it || it.ex!==item.ex) continue;
      if(!log.sets || !log.sets.some(st=>st.done)) continue;
      const pos = s.week*10 + d.idx;
      if(pos>bestPos){ bestPos=pos; best=log.variantId; }
    }
  }
  if(best && getVariant(best)) return best;
  return variantId(item.ex, EXERCISES[item.ex].variants[0].id);
}
/* Registro de ejercicio: el almacenado, o uno "virtual" (no guardado) con las series previstas vacías */
function viewLog(week, dayIdx, item){
  const s = getSession(week, dayIdx);
  if(s && s.ex && s.ex[item.slot]) return s.ex[item.slot];
  const vid = defaultVariantId(item); const v = getVariant(vid);
  return { variantId:vid, conv: v.type==='db' ? convOf(v) : null, split:false, notes:'',
    sets: Array.from({length:plannedSets(item, week)}, emptySet), virtual:true };
}
function materialize(week, dayIdx, item){
  const s = ensureSession(week, dayIdx);
  if(!s.ex[item.slot]){
    const v = viewLog(week, dayIdx, item); delete v.virtual;
    s.ex[item.slot] = v;
  }
  return s.ex[item.slot];
}

/* Valores efectivos de una serie */
function setVal(st, split){
  if(split) return (isNum(st.valL) && isNum(st.valR)) ? Math.min(st.valL, st.valR) : null;
  return isNum(st.val) ? st.val : null;
}
function setLoad(st, type){
  if(type==='band') return st.band && st.band.trim() ? st.band.trim() : null;
  if(isNum(st.load)) return st.load;
  return TYPES[type].loadReq ? null : 0;
}
const canComplete = (st, type, split) => setVal(st, split)!=null && setLoad(st, type)!=null;
const isCompleted = (st, type, split) => !!st.done && canComplete(st, type, split);
const hasAnyValue = st => isNum(st.load)||isNum(st.val)||isNum(st.valL)||isNum(st.valR)||(st.band&&st.band.trim())||isNum(st.rir);

/* Índice de entradas (una por ejercicio registrado en una sesión) */
let _entries = [];
function entries(){
  if(!dirtyEntries) return _entries;
  const out = [];
  for(const s of Object.values(state.sessions)){
    const d = DAY_BY_ID[s.day]; if(!d) continue;
    for(const [slot, log] of Object.entries(s.ex||{})){
      const item = ITEM_BY_SLOT[slot]; const v = getVariant(log.variantId);
      if(!item || !v || !Array.isArray(log.sets)) continue;
      const sets = [];
      log.sets.forEach((st, i)=>{ if(isCompleted(st, v.type, log.split)) sets.push({ i, load:setLoad(st, v.type), val:setVal(st, log.split), st }); });
      out.push({ key:keyOf(v, log.conv), v, slot, item, s, week:s.week, dayIdx:d.idx, pos:s.week*10+d.idx, date:s.date, log, sets });
    }
  }
  out.sort((a,b)=> a.pos-b.pos || a.item.slot.localeCompare(b.item.slot));
  _entries = out; dirtyEntries = false; return out;
}
const entriesFor = key => entries().filter(e=>e.key===key && e.sets.length);

/* Récords: solo series completadas */
function bestBy(list, cmp){ let b=null; for(const x of list){ if(!b || cmp(x,b)>0) b=x; } return b; }
function flatSets(key){ const r=[]; for(const e of entriesFor(key)) for(const s of e.sets) r.push(Object.assign({e}, s)); return r; }
function records(key, type){
  const all = flatSets(key);
  if(!all.length) return null;
  const R = {count:all.length};
  if(type==='weight' || type==='db'){
    R.load = bestBy(all, (a,b)=> a.load-b.load || a.val-b.val);          // mayor carga, desempate: más reps
    R.reps = bestBy(all, (a,b)=> a.val-b.val || a.load-b.load);          // más reps en una serie (récord distinto)
  } else if(type==='assist'){
    R.load = bestBy(all, (a,b)=> b.load-a.load || a.val-b.val);          // MENOR asistencia, desempate: más reps
    R.reps = bestBy(all, (a,b)=> a.val-b.val || b.load-a.load);
  } else if(type==='bw'){
    R.reps = bestBy(all, (a,b)=> a.val-b.val || a.load-b.load);
    const w = all.filter(x=>x.load>0); if(w.length) R.load = bestBy(w, (a,b)=> a.load-b.load || a.val-b.val);
  } else if(type==='iso'){
    R.reps = bestBy(all, (a,b)=> a.val-b.val || a.load-b.load);
    const w = all.filter(x=>x.load>0); if(w.length) R.load = bestBy(w, (a,b)=> a.load-b.load || a.val-b.val);
  } else if(type==='band'){
    R.bands = {};
    for(const x of all){ const k=x.load.toLowerCase(); if(!R.bands[k] || x.val>R.bands[k].val) R.bands[k]=x; }
  }
  return R;
}
function bestAtLoad(key, type, load){
  const all = flatSets(key).filter(x=> type==='band' ? String(x.load).toLowerCase()===String(load).toLowerCase() : x.load===load);
  return bestBy(all, (a,b)=> a.val-b.val);
}
function prevEntry(key, pos){
  const list = entriesFor(key).filter(e=>e.pos<pos);
  return list.length ? list[list.length-1] : null;
}

/* Formato de series */
const where = e => `sem ${e.week} · ${PLAN[e.dayIdx].name.toLowerCase()}`;
function unitVal(type, item){ const u = type==='iso' ? 's' : 'reps'; return item && item.perSide ? `${u}/lado` : u; }
function fmtSet(x, v, item){
  const u = unitVal(v.type, item);
  switch(v.type){
    case 'weight': case 'db': return `${fmt(x.load)} kg × ${x.val} ${u}`;
    case 'assist': return `${fmt(x.load)} kg de asistencia × ${x.val} ${u}`;
    case 'band':   return `goma ${esc(x.load)} × ${x.val} ${u}`;
    case 'bw':     return x.load>0 ? `+${fmt(x.load)} kg × ${x.val} ${u}` : `${x.val} ${u}`;
    case 'iso':    return `${x.val} s${item&&item.perSide?'/lado':''}${x.load>0?` con +${fmt(x.load)} kg`:''}`;
  }
}
function fmtSetsSummary(sets, v, item){
  if(!sets.length) return '—';
  const valStr = x => x.st && x.st.valL!=null && x.split ? `${x.st.valL}/${x.st.valR}` : String(x.val);
  const loads = [...new Set(sets.map(x=>String(x.load)))];
  const u = v.type==='iso' ? 's' : 'reps';
  const vals = sets.map(x=>x.val).join('/');
  if(loads.length===1){
    const l = sets[0].load;
    if(v.type==='weight'||v.type==='db') return `${fmt(l)} kg · ${vals}`;
    if(v.type==='assist') return `${fmt(l)} kg asist. · ${vals}`;
    if(v.type==='band') return `goma ${esc(l)} · ${vals}`;
    return (l>0?`+${fmt(l)} kg · `:'') + `${vals} ${u}`;
  }
  return sets.map(x=> v.type==='band' ? `${esc(x.load)}×${x.val}` : `${(v.type==='bw'||v.type==='iso')&&x.load>0?'+':''}${fmt(x.load)}×${x.val}`).join(' · ') + (v.type==='iso'?' s':'');
}
function loadLabel(v, conv){
  switch(v.type){
    case 'weight': return 'kg';
    case 'db': return conv==='total' ? 'kg total' : 'kg c/u';
    case 'assist': return 'Asist. kg';
    case 'band': return 'Goma';
    default: return 'Lastre kg';
  }
}

/* Progreso del día según series completadas */
function dayProgress(week, dayIdx){
  const d = PLAN[dayIdx]; let done=0, total=0;
  for(const it of d.items){
    const log = viewLog(week, dayIdx, it); const v = getVariant(log.variantId);
    total += log.sets.length;
    done += log.sets.filter(st=>isCompleted(st, v.type, log.split)).length;
  }
  const s = getSession(week, dayIdx);
  const run = s && s.run && isNum(s.run.dur);
  return {done, total, run};
}

function todayPosition(){
  const st = fromISO(state.profile.startDate);
  const now = new Date(); now.setHours(0,0,0,0);
  if(!st) return {week:ui.week, day:(now.getDay()+6)%7, noStart:true};
  const diff = Math.round((now - mondayOf(st))/86400000);
  if(diff < 0) return {week:1, day:(now.getDay()+6)%7, before:true};
  if(diff >= WEEKS*7) return {week:WEEKS, day:(now.getDay()+6)%7, after:true};
  return {week:Math.floor(diff/7)+1, day:diff%7};
}

function renderTrain(){
  const w = ui.week, di = ui.day, d = PLAN[di];
  const tp = todayPosition();
  const phase = PHASES(w);
  const s = getSession(w, di);
  const pd = plannedDate(w, di);
  let h = '';

  // Navegación de semana
  h += `<div class="wknav">

    const p = dayProgress(w,i);

    const isToday = !tp.noStart && !tp.before && !tp.after && tp.week===w && tp.day===i;

  // Cabecera de sesión
  const prog = dayProgress(w, di);
  h += `<section class="card night" id="sessHead">
    <div class="sess-top"><div>
      <div class="tag">${d.name} · Semana ${w}${pd?` · ${fmtDate(pd)}`:''}</div>

    </div></div>

    ${!d.rest && !d.optional ? `<div class="prog"><div class="prog-l"><span>Progreso</span><span class="num" id="progTxt">${prog.done}/${prog.total} series${d.run?(prog.run?' · carrera ✓':' · carrera pendiente'):''}</span></div><div class="bar"><i id="progBar" style="width:${prog.total?Math.round(prog.done/prog.total*100):0}%"></i></div></div>`:''}
    ${d.optional ? `<div class="prog small muted">Sesión opcional: si no la haces, no cuenta como incumplimiento.</div>`:''}
    <div class="datebox">
      <div><label class="lbl" for="sessDate">Fecha realizada</label><input class="field" type="date" id="sessDate" data-f="sessdate" value="${esc(s&&s.date || pd || '')}"></div>
      <div class="planned">${pd?`Prevista:<br><b class="num" style="color:var(--text)">${fmtDate(pd)}</b>`:`<span>Sin fecha de inicio.</span><br><button class="linkbtn" style="padding:0;min-height:32px" data-action="tab" data-tab="settings">Configurar</button>`}
      ${s&&s.date&&pd&&s.date!==pd?`<br><span class="pill grey" style="margin-top:4px">Otra fecha</span>`:''}</div>
    </div>

    ${!d.rest?`<details class="collap"><summary>Calentamiento (8–10 min)</summary><div class="body">${DOC.warmup}</div></details>`:''}

    }
  }
  // Carrera dentro del día
  if(d.run) h += runCardHTML(w, di);

  // Observaciones generales
  h += `<section class="card"><label class="lbl" for="dayNotes">Observaciones generales del día</label>
    <textarea class="field" id="dayNotes" data-f="daynotes" rows="3" placeholder="Sueño, energía, molestias…">${esc(s&&s.notes||'')}</textarea></section>`;

  // Recordatorio discreto de copia

  return h;
}

  const each = item.group ? ' cada uno' : '';

  const lbl = loadLabel(v, log.conv);
  const vu = item.unit==='s' ? (split?'Seg':'Seg') : 'Reps';
  let h = `<section class="ex has-cols" id="ex-${item.slot.replace('.','-')}" data-slot="${item.slot}"><div class="col-main">

      ${item.slot==='tue.squat' && w<=2 ? `<div class="small muted" style="margin-top:4px">Semanas 1–2: el documento permite usar goblet. Elige la variante abajo.</div>`:''}
    </div></div>`;
  if(ex.variants.length>1){
    h += `<div class="vsel"><label class="lbl" for="v-${item.slot}">Variante utilizada</label>
      <select class="field" id="v-${item.slot}" data-f="variant">${ex.variants.map(x=>`<option value="${variantId(item.ex,x.id)}" ${variantId(item.ex,x.id)===log.variantId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`;

  h += `<div class="realized" id="real-${item.slot.replace('.','-')}">${realizedHTML(item, log, v, planned)}</div>`;
  h += `<div class="setbtns">
      <button class="btn sm" data-action="addset">+ Serie</button>
      <button class="btn sm ghost" data-action="delset" ${log.sets.length<=0?'disabled':''}>− Quitar última</button>
      <button class="btn sm ghost wide" data-action="prefill">Recuperar datos de la última sesión</button>
    </div>`;

  // Opciones: convención mancuerna, lados
  const optsParts = [];
  if(v.type==='db') optsParts.push(`<div><div class="lbl">Peso de mancuernas</div><div class="seg" role="group" aria-label="Convención de peso">
      <button data-action="conv" data-v="per" class="${log.conv!=='total'?'on':''}">Por mancuerna</button><button data-action="conv" data-v="total" class="${log.conv==='total'?'on':''}">Total</button></div>
      <div class="tiny faint" style="margin-top:4px">El historial de cada convención se guarda por separado y no se mezcla.</div></div>`);
  if(item.perSide || v.unilateral) optsParts.push(`<label class="toggle"><input type="checkbox" data-f="split" ${split?'checked':''}> Registrar lado izquierdo y derecho por separado</label>`);

function realizedHTML(item, log, v, planned){
  const done = log.sets.map((st,i)=>({st,i})).filter(x=>isCompleted(x.st, v.type, log.split));
  const pending = log.sets.filter(st=>!st.done && hasAnyValue(st)).length;
  const parts = done.map(x=>{
    const val = log.split ? `${x.st.valL}/${x.st.valR}` : x.st.val;
    const l = setLoad(x.st, v.type);
    if(v.type==='band') return `${esc(l)}×${val}`;
    if(v.type==='bw'||v.type==='iso') return (l>0?`+${fmt(l)}×`:'') + val + (v.type==='iso'?' s':'');
    return `${fmt(l)}×${val}`;
  });
  let t = `<span class="tag">Realizado</span> `;
  t += done.length ? `<b class="num">${parts.join(' · ')}</b> <span class="faint">(${done.length} de ${log.sets.length} series${log.sets.length!==planned?`; previstas ${planned}`:''})</span>` : `<span class="faint">Sin series completadas${log.sets.length!==planned?` · ${log.sets.length} series (previstas ${planned})`:''}</span>`;
  if(pending) t += `<br><span class="faint">${pending} serie(s) con datos sin marcar como hechas: no cuentan.</span>`;
  if(log.split) t += `<br><span class="faint">Lados separados: para el récord cuenta el lado con menos ${v.type==='iso'?'segundos':'repeticiones'}.</span>`;
  return t;
}

function currentLoad(item, log, v){

  const pick = st => v.type==='band' ? (st.band&&st.band.trim()?st.band.trim():null) : (isNum(st.load)?st.load:null);

  for(let i=log.sets.length-1;i>=0;i--){ const l=pick(log.sets[i]); if(l!=null) return l; }

    } else if(v.type==='weight' || v.type==='db'){

      h += `<div class="r1">Récord de repeticiones: <span class="k">${fmtSet(R.reps, v, item)}</span> · ${where(R.reps.e)} ${todayTag(R.reps.e)}</div>`;
      if(R.load) h += `<div class="r2">Mayor lastre: ${fmt(R.load.load)} kg × ${R.load.val} ${u} · ${where(R.load.e)}</div>`;
    } else if(v.type==='iso'){
      h += `<div class="r1">Récord: <span class="k">${fmtSet(R.reps, v, item)}</span> · ${where(R.reps.e)} ${todayTag(R.reps.e)}</div>`;
    }
    const cur = currentLoad(item, log, v);
    const showAt = cur!=null && (v.type==='weight'||v.type==='db'||v.type==='assist'|| ((v.type==='bw'||v.type==='iso') && cur>0));

  h += `<div class="r3">Última sesión: ${p ? `${fmtSetsSummary(p.sets, v, item)} · ${where(p)}${p.date?` · ${fmtDateShort(p.date)}`:''}` : 'sin sesión anterior'}</div>`;
  h += shared;
  return h;
}

   6. VISTA · EVOLUCIÓN (gráficos SVG propios)

function evoOptions(){
  const opts = [];
  const ents = entries();
  for(const exId of EX_ORDER){
    const ex = EXERCISES[exId];
    for(const vv of ex.variants){
      const v = getVariant(variantId(exId, vv.id));
      const convs = v.type==='db' ? ['per','total'] : [null];
      for(const c of convs){
        const key = c ? `${v.vid}@${c}` : v.vid;
        const n = ents.filter(e=>e.key===key && e.sets.length).length;
        if(c==='total' && !n) continue;
        const name = ex.variants.length>1 ? `${ex.name} — ${vv.name}` : ex.name;
        opts.push({key, v, conv:c, n, label: name + (c?` (${c==='total'?'kg total':'kg por mancuerna'})`:'')});
      }
    }
  }
  return opts;
}
function metricsFor(type){
  if(type==='weight'||type==='db') return [['max','Mayor carga por sesión'],['acc','Récord acumulado'],['at','Reps con un peso']];
  if(type==='assist') return [['max','Asistencia por sesión'],['acc','Menor asistencia acumulada'],['at','Reps con una asistencia']];
  if(type==='iso') return [['max','Segundos (mejor serie)'],['acc','Récord acumulado']];
  if(type==='bw') return [['max','Máx. reps por sesión'],['acc','Récord acumulado'],['at','Reps con un lastre']];
  if(type==='band') return [['at','Reps con una goma']];
  return [];
}
function evoPoints(key, type, metric, atLoad){
  const list = entriesFor(key);
  const pts = [];
  const xOf = e => e.week + (e.dayIdx+0.5)/7;
  const pick = (e, best) => ({ x:xOf(e), e, set:best });
  if(metric==='max' || metric==='acc'){
    let acc = null;
    for(const e of list){
      let best;
      if(type==='assist') best = bestBy(e.sets, (a,b)=> b.load-a.load || a.val-b.val);
      else if(type==='iso'||type==='bw') best = bestBy(e.sets, (a,b)=> a.val-b.val || a.load-b.load);
      else best = bestBy(e.sets, (a,b)=> a.load-b.load || a.val-b.val);
      const yv = (type==='iso'||type==='bw') ? best.val : best.load;
      if(metric==='max') pts.push(Object.assign(pick(e,best), {y:yv}));
      else {
        const better = acc==null || (type==='assist' ? yv < acc.y || (yv===acc.y && best.val>acc.set.val) : yv > acc.y || (yv===acc.y && (type==='iso'||type==='bw' ? best.load>acc.set.load : best.val>acc.set.val)));
        if(better) acc = Object.assign(pick(e,best), {y:yv, isNew:true}); else acc = Object.assign({}, acc, {x:xOf(e), e, isNew:false, from:acc.from||acc.e});
        pts.push(Object.assign({}, acc, {recE: acc.isNew?e:(acc.from||acc.e)}));
      }
    }
  } else if(metric==='at'){
    for(const e of list){
      const m = e.sets.filter(x=> type==='band' ? String(x.load).toLowerCase()===String(atLoad).toLowerCase() : x.load===atLoad);
      if(!m.length) continue;
      const best = bestBy(m, (a,b)=>a.val-b.val);
      pts.push(Object.assign(pick(e,best), {y:best.val}));
    }
  }
  return pts;
}
function distinctLoads(key, type){
  const s = new Map();
  for(const x of flatSets(key)){ const k = type==='band'? String(x.load).toLowerCase() : x.load; if(!s.has(k)) s.set(k, x.load); }
  const arr = [...s.values()];
  return type==='band' ? arr.sort() : arr.sort((a,b)=>a-b);
}

function niceTicks(min, max, count=4){
  if(min===max){ const d = Math.abs(min)*0.1 || 1; min-=d; max+=d; }
  const span = max-min; const step0 = span/count; const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0) || 10*mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step;
  const t=[]; for(let v=lo; v<=hi+step/1e6; v+=step) t.push(round2(v));
  return {lo, hi, ticks:t};
}
/* Gráfico de línea. mode 'week' = eje de semanas 1–8 (ausencias visibles); 'date' = eje temporal */
function chartSVG(pts, {mode='week', yFmt=fmt, yUnit='', step=false, id='c'}={}){
  const W=340, H=232, L=46, R=10, T=22, B=36;
  const iw=W-L-R, ih=H-T-B;
  if(!pts.length) return `<div class="cinfo">No hay registros para mostrar todavía.</div>`;
  let x0, x1;
  if(mode==='week'){ x0=1; x1=WEEKS+1; } else { x0=Math.min(...pts.map(p=>p.x)); x1=Math.max(...pts.map(p=>p.x)); if(x0===x1){ x0-=3*86400000; x1+=3*86400000; } const pd=(x1-x0)*0.06; x0-=pd; x1+=pd; }
  const ys = pts.map(p=>p.y); const nt = niceTicks(Math.min(...ys), Math.max(...ys));
  const X = x => L + (x-x0)/(x1-x0)*iw, Y = y => T + ih - (y-nt.lo)/(nt.hi-nt.lo)*ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolución">
    <defs><pattern id="hatch-${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2a3443" stroke-width="2"/></pattern></defs>`;
  // ausencias
  if(mode==='week'){
    const withData = new Set(pts.map(p=>Math.floor(p.x)));
    for(let w=1; w<=WEEKS; w++) if(!withData.has(w)) s += `<rect x="${X(w)+1}" y="${T}" width="${iw/WEEKS-2}" height="${ih}" fill="url(#hatch-${id})" opacity=".55"/>`;
  }
  // rejilla y ejes
  s += `<g class="grid">` + nt.ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/>`).join('') + `</g>`;
  s += `<g class="axis">` + nt.ticks.map(t=>`<text x="${L-6}" y="${Y(t)+3.5}" text-anchor="end">${yFmt(t)}</text>`).join('');
  s += `<text x="${L-6}" y="${T-9}" text-anchor="end" style="font-weight:700;fill:#c3ccd8">${esc(yUnit)}</text>`;
  if(mode==='week'){
    for(let w=1; w<=WEEKS; w++){ s += `<text x="${X(w+0.5)}" y="${H-B+16}" text-anchor="middle">S${w}</text>`; if(w>1) s+=`<line x1="${X(w)}" x2="${X(w)}" y1="${T}" y2="${T+ih}" stroke="#1a222d"/>`; }
    s += `<text x="${L+iw/2}" y="${H-4}" text-anchor="middle" style="fill:#7d8898">Semana del programa</text>`;
  } else {
    const tk = [x0+(x1-x0)*0.06, (x0+x1)/2, x1-(x1-x0)*0.06];
    tk.forEach(t=>{ const d=new Date(t); s+=`<text x="${X(t)}" y="${H-B+16}" text-anchor="middle">${d.getDate()} ${MON[d.getMonth()]}</text>`; });
    s += `<text x="${L+iw/2}" y="${H-4}" text-anchor="middle" style="fill:#7d8898">Fecha</text>`;
  }
  s += `<line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="#3a475b"/></g>`;
  // líneas (cortadas cuando hay una semana sin datos entre dos puntos)
  let path = '', prev = null;
  pts.forEach(p=>{
    const gap = prev && mode==='week' && (Math.floor(p.x) - Math.floor(prev.x) > 1);
    if(!prev || gap) path += `M${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`;
    else if(step) path += `H${X(p.x).toFixed(1)}V${Y(p.y).toFixed(1)}`;
    else path += `L${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`;
    prev = p;
  });
  s += `<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{
    s += `<circle class="pt ${ui.chartSel===id+':'+i?'sel':''}" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4.5"/>`;
    s += `<circle class="hit" data-action="pt" data-c="${id}" data-i="${i}" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="14" aria-label="Punto ${i+1}"/>`;
  });
  return s + `</svg>`;
}
let chartData = {};

function renderEvo(){
  const ev = state.settings.evo || (state.settings.evo = {});
  const opts = evoOptions();
  const withData = opts.filter(o=>o.n);
  if(!ev.key || !opts.find(o=>o.key===ev.key)) ev.key = (withData[0]||opts[0]).key;
  const cur = opts.find(o=>o.key===ev.key);
  const ms = metricsFor(cur.v.type);
  if(!ev.metric || !ms.find(m=>m[0]===ev.metric)) ev.metric = ms[0][0];
  const loads = distinctLoads(cur.key, cur.v.type);
  if(ev.metric==='at' && (ev.at==null || !loads.some(l=>String(l)===String(ev.at)))) ev.at = loads.length ? loads[loads.length-1] : null;
  const atVal = cur.v.type==='band' ? ev.at : (ev.at!=null?Number(ev.at):null);

  let h = `<section class="card"><h2>Evolución por ejercicio</h2>
    <div style="margin-top:10px"><label class="lbl" for="evoKey">Ejercicio y variante</label>
    <select class="field" id="evoKey" data-f="evo.key">${opts.map(o=>`<option value="${o.key}" ${o.key===ev.key?'selected':''}>${esc(o.label)}${o.n?` · ${o.n} ses.`:' · sin datos'}</option>`).join('')}</select></div>
    <div style="margin-top:10px"><div class="lbl">Qué ver</div><div class="seg" role="group">${ms.map(m=>`<button data-action="evometric" data-v="${m[0]}" class="${m[0]===ev.metric?'on':''}">${m[1]}</button>`).join('')}</div></div>`;
  if(ev.metric==='at'){
    const lt = cur.v.type==='band' ? 'Goma' : cur.v.type==='assist' ? 'Asistencia (kg)' : (cur.v.type==='bw') ? 'Lastre (kg)' : 'Peso (kg)';
    h += `<div style="margin-top:10px"><label class="lbl" for="evoAt">${lt}</label>${loads.length?`<select class="field" id="evoAt" data-f="evo.at">${loads.map(l=>`<option value="${esc(l)}" ${String(l)===String(ev.at)?'selected':''}>${cur.v.type==='band'?esc(l):fmt(l)+' kg'}</option>`).join('')}</select>`:'<div class="small muted">Sin registros.</div>'}</div>`;
  }
  const pts = evoPoints(cur.key, cur.v.type, ev.metric, atVal);
  const t = cur.v.type;
  const yUnit = ev.metric==='at' ? (t==='iso'?'s':'reps') : (t==='iso' ? 's' : t==='bw' ? 'reps' : t==='assist' ? 'kg asist.' : 'kg');
  chartData.evo = {pts, cur, metric:ev.metric};

  if(pts.length) h += `<div class="legend"><span><i style="background:var(--accent)"></i>${ms.find(m=>m[0]===ev.metric)[1]}</span><span><i style="background:repeating-linear-gradient(45deg,#2a3443 0 2px,transparent 2px 5px)"></i>Semana sin datos</span></div>`;
  if(t==='assist') h += `<div class="small muted" style="margin-top:6px">En la máquina asistida, una línea que baja es un avance (menos ayuda).</div>`;
  h += `<div class="cinfo" id="cinfo-evo">${pts.length?'Toca un punto para ver la fecha, la semana, el día y la serie.':'Registra series completadas de este ejercicio para ver su evolución.'}</div>`;
  const R = records(cur.key, t);
  if(R){
    let rs='';
    if(t==='band') rs = Object.values(R.bands).map(b=>`Goma ${esc(b.load)}: ${b.val} reps (${where(b.e)})`).join('<br>');
    else if(t==='assist') rs = `Menor asistencia: <b>${fmtSet(R.load, cur.v)}</b> · ${where(R.load.e)}<br>Más reps en una serie: ${fmtSet(R.reps, cur.v)} · ${where(R.reps.e)}`;
    else if(t==='weight'||t==='db') rs = `Récord de carga: <b>${fmtSet(R.load, cur.v)}</b> · ${where(R.load.e)}<br>Récord de repeticiones: ${fmtSet(R.reps, cur.v)} · ${where(R.reps.e)}`;
    else rs = `Récord: <b>${fmtSet(R.reps, cur.v)}</b> · ${where(R.reps.e)}${R.load?`<br>Mayor lastre: ${fmtSet(R.load, cur.v)} · ${where(R.load.e)}`:''}`;
    h += `<div class="small" style="margin-top:10px;color:var(--muted)">${rs}</div>`;
  }
  // Tabla de sesiones
  const list = entriesFor(cur.key);
  if(list.length){
    h += `<details class="collap"><summary>Sesiones registradas (${list.length})</summary><table class="list"><thead><tr><th>Sesión</th><th>Series completadas</th></tr></thead><tbody>${list.slice().reverse().map(e=>`<tr><td>S${e.week} · ${PLAN[e.dayIdx].name.slice(0,3)}<br><span class="faint">${fmtDateShort(e.date)}</span></td><td class="num">${fmtSetsSummary(e.sets, cur.v, e.item)}</td></tr>`).join('')}</tbody></table></details>`;

  if(rpts.length < 2){
    h += `<div class="cinfo" style="margin-top:10px">${rpts.length? 'Hay 1 registro. Con al menos 2 se muestra la evolución.' : rm==='dur' ? 'Sin carreras registradas todavía.' : 'Necesitas registrar distancia (y duración) para ver esta medida.'}</div>`;
    if(rpts.length===1) h += `<div class="chart">${chartSVG(rpts, {id:'run', yUnit: rm==='dur'?'min':rm==='dist'?'km':'min/km', yFmt: rm==='pace'?fmtPace:fmt})}</div>`;

  }

  return h;
}

function download(name, text, type){
  try{
    const blob = new Blob([text], {type});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
    return true;
  }catch(e){ toast('Este visor no permite descargas. Abre el archivo en un navegador.'); return false; }
}
function exportJSON(){
  const data = JSON.parse(JSON.stringify(state));
  const out = { app:APP_ID, version:DATA_VERSION, exportedAt:new Date().toISOString(), data };
  if(download(`entreno8-copia-${todayISO()}.json`, JSON.stringify(out, null, 1), 'application/json')){
    state.settings.lastBackup = new Date().toISOString(); save(true);

function validateImport(obj){
  const d = obj && obj.app===APP_ID && obj.data ? obj.data : obj;
  if(!d || typeof d!=='object' || d.app!==APP_ID) throw new Error('El archivo no es una copia de esta aplicación.');
  if(typeof d.sessions!=='object' || !Array.isArray(d.body)) throw new Error('Faltan sesiones o medidas en la copia.');
  for(const [id, s] of Object.entries(d.sessions)){
    if(!/^w[1-8]-(mon|tue|wed|thu|fri|sat|sun)$/.test(id) || !s || s.id!==id) throw new Error(`Sesión no válida: ${id}`);
    for(const [slot, log] of Object.entries(s.ex||{})){
      if(!ITEM_BY_SLOT[slot] || !getVariant(log.variantId) || !Array.isArray(log.sets)) throw new Error(`Ejercicio no válido en ${id}: ${slot}`);
    }
  }
  return migrate(d);
}
function importJSON(file){

    if(!ok) return;
    state = nd; dirtyEntries = true;
    if(save()) toast('Copia importada'); render();
  };
  fr.onerror = () => modalAlert('No se puede leer', 'No se ha podido leer el archivo.');
  fr.readAsText(file);
}
function csvCell(v){

}

/* =========================================================================
   11. TEMPORIZADOR DE DESCANSO (basado en hora absoluta: correcto al cambiar de pestaña)
   ========================================================================= */
let timer = null, timerInt = null, audioCtx = null;
function timerPersist(){ try{ timer ? localStorage.setItem(TIMER_KEY, JSON.stringify(timer)) : localStorage.removeItem(TIMER_KEY); }catch(e){} }
function timerRemaining(){ if(!timer) return 0; return timer.running ? Math.max(0, timer.end - Date.now()) : timer.left; }
function startTimer(sec, label){
  try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  timer = { total:sec*1000, end:Date.now()+sec*1000, left:sec*1000, running:true, label, fired:false };
  timerPersist(); timerTick(); if(!timerInt) timerInt=setInterval(timerTick, 250);
}
function timerTick(){
  const el = $('#timer');
  if(!timer){ el.hidden=true; document.body.classList.remove('has-timer'); clearInterval(timerInt); timerInt=null; return; }
  el.hidden=false; document.body.classList.add('has-timer');
  const ms = timerRemaining(); const s = Math.ceil(ms/1000);
  $('#tTime').textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  $('#tName').textContent = ms<=0 ? `¡Descanso terminado! · ${timer.label}` : `${timer.running?'Descanso':'En pausa'} · ${timer.label}`;
  $('#tToggle').innerHTML = timer.running && ms>0 ? ICON.pause : ICON.play;
  $('#tToggle').setAttribute('aria-label', timer.running && ms>0 ? 'Pausar' : 'Reanudar');
  el.classList.toggle('end', ms<=0);
  if(ms<=0 && !timer.fired){ timer.fired=true; timer.running=false; timer.left=0; timerPersist(); timerAlarm(); }
}
function timerAlarm(){
  try{ navigator.vibrate && navigator.vibrate([250,120,250]); }catch(e){}
  try{ if(audioCtx){ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=880; g.gain.setValueAtTime(0.0001,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.25,audioCtx.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.6); o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.65);} }catch(e){}
}
function timerToggle(){
  if(!timer) return;
  const ms = timerRemaining();
  if(ms<=0){ timer.end=Date.now()+timer.total; timer.running=true; timer.fired=false; }
  else if(timer.running){ timer.left=ms; timer.running=false; }
  else { timer.end=Date.now()+timer.left; timer.running=true; }
  timerPersist(); timerTick(); if(!timerInt) timerInt=setInterval(timerTick,250);
}
function timerReset(){ if(!timer) return; timer.end=Date.now()+timer.total; timer.left=timer.total; timer.running=true; timer.fired=false; timerPersist(); timerTick(); if(!timerInt) timerInt=setInterval(timerTick,250); }
function timerAdd(sec){ if(!timer) return; if(timer.running) timer.end+=sec*1000; else timer.left+=sec*1000; if(timerRemaining()>0) timer.fired=false; timer.total+=sec*1000; timerPersist(); timerTick(); }
function timerRestore(){ try{ const t=JSON.parse(localStorage.getItem(TIMER_KEY)||'null'); if(t && typeof t.end==='number'){ timer=t; if(timerRemaining()<=0 && t.running){ timer.fired=true; timer.running=false; timer.left=0; } timerTick(); timerInt=setInterval(timerTick,250);} }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) timerTick(); });

/* =========================================================================
   12b. SINCRONIZACIÓN OPCIONAL CON SUPABASE (API REST con fetch, sin librerías)
   - Una fila por usuario en la tabla public.entreno_data (data jsonb).
   - Al abrir y al volver a la app: se descarga. Tras cada cambio: se sube (2,5 s después).
   - Si hay cambios a la vez en la nube y en este dispositivo, se pregunta cuál conservar.
   ========================================================================= */
const CLOUD_KEY = 'entreno8:cloud';
let cloud = (()=>{ try{ return JSON.parse(localStorage.getItem(CLOUD_KEY)||'null') || {}; }catch(e){ return {}; } })();
const cloudSave = () => { try{ localStorage.setItem(CLOUD_KEY, JSON.stringify(cloud)); }catch(e){} };
const cloudConfigured = () => !!(cloud.url && cloud.key);
const cloudOn = () => cloudConfigured() && !!cloud.session;
let syncBusy = false, syncAgain = false, syncTimer = null, lastPull = 0;

function setCloud(status, text){
  const el = $('#cloudState'); if(!el) return;
  el.hidden = !cloudOn(); el.className = 'cloud ' + status; el.textContent = text;
}
async function sbFetch(path, opts={}, auth=true){
  const headers = Object.assign({'apikey':cloud.key, 'Content-Type':'application/json'}, opts.headers||{});
  if(auth){ await ensureToken(); headers.Authorization = 'Bearer ' + cloud.session.access_token; }
  let res;
  try{ res = await fetch(cloud.url.replace(/\/+$/,'') + path, Object.assign({}, opts, {headers})); }
  catch(e){ const err = new Error('Sin conexión con Supabase'); err.offline = true; throw err; }
  const txt = await res.text(); let body = null; try{ body = txt ? JSON.parse(txt) : null; }catch(e){ body = txt; }
  if(!res.ok){
    const msg = (body && (body.error_description || body.msg || body.message || body.error_code || body.error)) || ('Error ' + res.status);
    const err = new Error(String(msg)); err.status = res.status; throw err;
  }
  return body;
}
function storeSession(r){
  cloud.session = { access_token:r.access_token, refresh_token:r.refresh_token,
    expires_at: r.expires_at || Math.floor(Date.now()/1000) + (r.expires_in||3600),
    user: { id:r.user.id, email:r.user.email } };
  cloudSave();
}
async function ensureToken(){
  const se = cloud.session; if(!se) { const e=new Error('No has iniciado sesión'); e.status=401; throw e; }
  if(se.expires_at && Date.now()/1000 < se.expires_at - 60) return;
  try{ storeSession(await sbFetch('/auth/v1/token?grant_type=refresh_token', {method:'POST', body:JSON.stringify({refresh_token:se.refresh_token})}, false)); }
  catch(e){ if(!e.offline){ cloud.session = null; cloudSave(); e.status = 401; e.message = 'La sesión ha caducado. Vuelve a entrar.'; } throw e; }
}
const localDirty = () => !!state.updatedAt && state.updatedAt !== cloud.pushedLocal;
async function pullRemote(){
  const rows = await sbFetch(`/rest/v1/entreno_data?select=data,updated_at&user_id=eq.${encodeURIComponent(cloud.session.user.id)}`);
  lastPull = Date.now();
  return Array.isArray(rows) && rows[0] ? rows[0] : null;
}
async function pushRemote(){
  const localStamp = state.updatedAt;
  const rows = await sbFetch('/rest/v1/entreno_data?on_conflict=user_id', { method:'POST',
    headers:{ Prefer:'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify({ user_id:cloud.session.user.id, data:state, updated_at:new Date().toISOString() }) });
  if(!Array.isArray(rows) || !rows[0]) throw new Error('Supabase no ha confirmado el guardado. Revisa la tabla y las políticas.');
  cloud.remoteStamp = rows[0].updated_at; cloud.pushedLocal = localStamp; cloud.lastSync = Date.now(); cloud.lastError = null; cloudSave();
}
function applyRemote(remote){
  const nd = validateImport(remote.data);           // valida y migra; lanza error si no es válido
  try{ localStorage.setItem('entreno8:antes-de-sincronizar', JSON.stringify(state)); }catch(e){}
  state = nd; dirtyEntries = true;
  cloud.remoteStamp = remote.updated_at; cloud.pushedLocal = state.updatedAt; cloud.lastSync = Date.now(); cloud.lastError = null; cloudSave();
  save(true);
  const lv = state.settings.lastView || {}; ui.week = Math.min(WEEKS, Math.max(1, Number(lv.week)||ui.week)); ui.day = Math.min(6, Math.max(0, Number(lv.day)||0));
  const y = scrollY; const typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(!typing){ render(); scrollTo(0, y); }
}
function chooseConflict(remote){
  const rd = remote.data || {}; const nR = Object.keys(rd.sessions||{}).length, nL = Object.keys(state.sessions).length;
  const when = d => d ? new Date(d).toLocaleString('es-ES') : '—';
  return new Promise(res=>{ modalResolve = res; openModal(`<h3>Hay cambios en dos sitios</h3>
    <p>Los datos de la nube y los de este dispositivo han cambiado desde la última sincronización. Elige cuáles conservar; los otros se guardan como copia interna en este navegador.</p>
    <p><b style="color:var(--text)">Nube:</b> ${nR} sesiones · última modificación ${when(rd.updatedAt||remote.updated_at)}<br><b style="color:var(--text)">Este dispositivo:</b> ${nL} sesiones · última modificación ${when(state.updatedAt)}</p>
    <p class="tiny faint">Consejo: si dudas, descarga antes una copia JSON desde Ajustes.</p>
    <div class="acts"><button class="btn primary" data-action="modal-choice" data-v="local">Conservar este dispositivo</button>
    <button class="btn" data-action="modal-choice" data-v="cloud">Usar los datos de la nube</button>
    <button class="btn ghost" data-action="modal-choice" data-v="later">Decidir más tarde</button></div>`); });
}
async function syncNow(manual){
  if(!cloudOn()) return;
  if(syncBusy){ syncAgain = true; return; }
  syncBusy = true; clearTimeout(syncTimer);
  if(navigator.onLine === false){ setCloud('wait','Nube ⏸'); syncBusy = false; if(manual) toast('Sin conexión: se sincronizará al volver la red.'); return; }
  setCloud('busy','Nube…');
  try{
    const remote = await pullRemote();
    const remoteChanged = !!remote && remote.updated_at !== cloud.remoteStamp;
    if(remoteChanged && localDirty()){
      const choice = await chooseConflict(remote);
      if(choice === 'cloud') applyRemote(remote);
      else if(choice === 'local') await pushRemote();
      else { setCloud('wait','Nube ⚠'); cloud.lastError = 'Conflicto pendiente: pulsa «Sincronizar ahora».'; cloudSave(); return; }
    } else if(remoteChanged){ applyRemote(remote); }
    else if(!remote || localDirty()){ await pushRemote(); }
    cloud.lastSync = Date.now(); cloud.lastError = null; cloudSave();
    const t = new Date(); setCloud('ok', `Nube ✓ ${pad2(t.getHours())}:${pad2(t.getMinutes())}`);
    if(manual) toast('Sincronizado con Supabase');
  }catch(e){
    cloud.lastError = e.message; cloudSave();
    if(e.offline){ setCloud('wait','Nube ⏸'); if(manual) toast('Sin conexión: se reintentará.'); }
    else if(e.status === 401 || e.status === 403){ setCloud('err','Nube ✕'); toast(e.status===401 ? 'Vuelve a iniciar sesión en la nube (Ajustes).' : 'Supabase ha rechazado el acceso. Revisa las políticas de la tabla.'); }
    else { setCloud('err','Nube ✕'); if(manual) toast('Error de sincronización: ' + e.message); }
  }finally{
    syncBusy = false;
    if(ui.tab === 'settings' && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))){ const y=scrollY; render(); scrollTo(0,y); }
    if(syncAgain){ syncAgain = false; scheduleSync(500); }
  }
}
function scheduleSync(ms=2500){ if(!cloudOn()) return; clearTimeout(syncTimer); setCloud('wait','Nube…'); syncTimer = setTimeout(()=>syncNow(false), ms); }
window.addEventListener('online', ()=>syncNow(false));
document.addEventListener('visibilitychange', ()=>{
  if(!cloudOn()) return;
  if(document.hidden){ if(localDirty()) syncNow(false); }          // intenta subir al salir de la app
  else if(Date.now() - lastPull > 20000) syncNow(false);           // y bajar al volver
});

async function cloudAuth(kind){
  const email = ($('#cl_email')||{}).value?.trim(), pass = ($('#cl_pass')||{}).value || '';
  if(!email || !pass) return toast('Escribe tu email y tu contraseña');
  if(pass.length < 6) return toast('La contraseña debe tener al menos 6 caracteres');
  try{
    if(kind === 'signup'){
      const r = await sbFetch('/auth/v1/signup', {method:'POST', body:JSON.stringify({email, password:pass})}, false);
      if(!(r && r.access_token)){ return modalAlert('Revisa tu correo', 'Supabase te ha enviado un email de confirmación. Pulsa el enlace y después vuelve aquí y pulsa <b>Entrar</b>.'); }
      storeSession(r);
    } else {
      storeSession(await sbFetch('/auth/v1/token?grant_type=password', {method:'POST', body:JSON.stringify({email, password:pass})}, false));
    }
    cloud.remoteStamp = null; cloud.pushedLocal = null; cloudSave();
    render(); await syncNow(true);
  }catch(e){
    const m = /invalid login/i.test(e.message) ? 'Email o contraseña incorrectos.' : /not confirmed/i.test(e.message) ? 'Aún no has confirmado el email. Busca el correo de Supabase.' : e.message;
    modalAlert('No se ha podido entrar', esc(m));
  }
}
